name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) has its own test workflows (muya-test, muya-spec).
    # Skip the desktop unit tests on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit tests take ~1 min. This cap exists to stop a hung dependency
    # download from eating 6 hours of minutes - the GitHub default is 360.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Unit tests are pure vitest+jsdom (no native builds — setup skips
        # postinstall), so they run on both delivery desktop platforms.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run Unit Tests
        run: pnpm test
