name: E2E Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'
  # Manual re-run. e2e is the one workflow whose failures historically gave
  # zero diagnostics, so being able to trigger it without a PR is worth it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Full postinstall + build + the whole e2e suite takes ~7 min on linux. The
    # macOS leg below has never run, so it gets the same cap and can only prove
    # itself slower or fail — never silently hang for hours.
    timeout-minutes: 30

    strategy:
      # Same reason build.yml sets this: one leg flaking must not cancel the
      # other's results, or a red run reads as two red runs.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            platform: linux
          # O14 ②: the product ships macOS installers, and the whole Playwright
          # suite ran exclusively on ubuntu-24.04 until now. Windows is
          # deliberately not added here (see docs/OPTIMIZATION_ROADMAP.md O14:
          # headless Electron plus the native modules cost more than they buy,
          # and `test.yml` already covers Windows at the unit level).
          - name: macos
            os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      # The export spec shells out to the pandoc CLI for EPUB/LaTeX/RTF/OPML and
      # skips those four when it is missing. It was missing on both runners, so
      # those conversions had only ever been proven on one machine — this is the
      # same thing a user does (the app looks `pandoc` up on PATH).
      # The last two lines are deliberately unpiped: `pandoc --version | head -1`
      # would report the status of `head`, so a runner where the install silently
      # produced no binary would still go green — with the four cases skipped,
      # which is exactly the state this step exists to end.
      - name: Install pandoc
        run: |
          if [ "${{ matrix.platform }}" = 'linux' ]; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          else
            brew install pandoc
          fi
          command -v pandoc
          pandoc --version

      - uses: ./.github/actions/setup

      # Mirrors build.yml: must be set before postinstall runs electron-rebuild.
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: Build app
        run: pnpm build

      # Linux has no display server, hence xvfb. macOS runners boot into a real
      # window-server session, so the Electron windows launch without one — and
      # `xvfb-run` does not exist there.
      - name: Run E2E Tests (linux)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Run E2E Tests (macos)
        if: matrix.platform == 'macos'
        run: pnpm test:e2e

      # Playwright writes traces (see trace: 'on-first-retry' in
      # test/e2e/playwright.config.ts) and an HTML report under
      # packages/desktop/. Without this upload a red e2e job produces zero
      # diagnostics, which is why every past e2e failure had to be
      # reproduced locally.
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Two legs, two artifacts: a shared name would make the second upload
          # overwrite the first, and the leg that failed is the one you need.
          name: e2e-diagnostics-${{ matrix.name }}
          path: |
            packages/desktop/test-results/**
            packages/desktop/playwright-report/**
          retention-days: 14
          # A failure in an earlier step leaves no results dir; the upload
          # must not turn that into a second failure.
          if-no-files-found: ignore

