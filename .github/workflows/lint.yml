name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) self-lints via .github/workflows/muya-lint.yml.
    # Skip the desktop lint+typecheck on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'
  # Issue #20: a merge into develop used to produce ZERO remote runs (measured on
  # two separate merge commits: `check-suites` and `actions/runs?head_sha` both
  # `total_count: 0`), so the PR gate was the only remote verification and the
  # integrated tip of develop was never checked until a promote PR re-ran it.
  # Push triggers only evaluate required checks on PRs, so this cannot conflict
  # with the branch protection in #21.
  #
  # Trigger-only change -- no job, step or matrix was touched. The same
  # paths-ignore as the PR event, so a muya-only merge stays excluded here too.
  # Cost is the light group only (~18 min of job minutes measured on PR #19's
  # 18.05 / PR #22's 18.73); packaging (~31 min) and the full E2E (~22 min) stay
  # PR-only, and e2e.yml is deliberately NOT given a push trigger.
  push:
    branches:
      - develop
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # eslint + knip + the muya type build + vue-tsc together take ~4 min.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Check markdown links
        run: python3 scripts/check-md-links.py

      - name: Check dependency hygiene (knip)
        run: pnpm knip

      # O24: the dependency-only sweep above is all `pnpm knip` ever looked at,
      # so unused files/exports/types were invisible to CI while being the bulk of
      # the debt. Reported here, not enforced, until the ignore list is reviewed
      # (docs/OPTIMIZATION_ROADMAP.md O24) — the dependency gate stays blocking.
      - name: Report unused files, exports and types (knip)
        continue-on-error: true
        run: pnpm knip:full

      # @muyajs/core points its `types` condition at packages/muya/lib/types,
      # which is git-ignored and therefore absent on CI. Without it vue-tsc
      # falls through to the `import` condition and type-checks muya's TS
      # sources under desktop's strict config, which they do not satisfy.
      - name: Build @muyajs/core types
        run: pnpm -C packages/muya build

      - name: Run TypeScript typecheck
        run: pnpm typecheck
