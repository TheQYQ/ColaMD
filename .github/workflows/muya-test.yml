name: Muya Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/src/**'
      - 'packages/muya/test/**'
      - 'packages/muya/package.json'
      - 'packages/muya/vite.config.ts'
      - 'packages/muya/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Windows leg: the engine unit suite is where path-separator and EOL
    # differences surface — the round-trip fixtures already bit CRLF checkouts
    # once (pinned by .gitattributes, guarded by fixtureEol.spec.ts), and an
    # ubuntu-only CI could never see that class of failure. The other muya
    # workflows stay ubuntu-only on purpose: lint/build/madge run
    # platform-independent tooling, and muya-e2e exercises chromium, whose
    # behavior does not vary by OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run muya unit tests
        # The M1.0 keystroke microbench is excluded from the default run at the
        # config level (vite.config.ts test.exclude): its 1MB tier needs ~8-10min
        # and ~2GB+ heap per worker, which OOMs the default ubuntu runner.
        # Drive it locally / on demand: pnpm -C packages/muya test:perf
        run: pnpm -C packages/muya test
