name: Muya Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/src/**'
      - 'packages/muya/test/**'
      - 'packages/muya/package.json'
      - 'packages/muya/vite.config.ts'
      - 'packages/muya/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run muya unit tests
        # The M1.0 keystroke microbench (keystrokePipeline.bench.spec.ts) is
        # excluded: its 1MB tier needs ~8-10min and ~2GB+ heap per worker,
        # which OOMs the default ubuntu runner. Drive it locally / on demand
        # per packages/muya/docs/perf-baseline.md (pnpm -C packages/muya test:perf).
        run: pnpm -C packages/muya exec vitest run --exclude 'src/state/__tests__/keystrokePipeline.bench.spec.ts'
