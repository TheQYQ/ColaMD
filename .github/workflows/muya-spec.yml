name: Muya Spec (CommonMark + GFM)

on:
  # Manual runs exist to exercise the suites without touching packages/muya
  # just to trip the path filter below.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/src/**'
      - 'packages/muya/test/**'
      - 'packages/muya/package.json'
      - 'packages/muya/vite.config.ts'
      - 'packages/muya/vitest.spec.config.ts'
      - 'packages/muya/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-spec.yml'

# Spec suite runs ~670 fixtures; give it a dedicated concurrency group so
# repeated pushes do not pile up but do not cancel sibling muya workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    # Windows leg: the conformance suites read repo fixtures byte-for-byte and
    # pin expected failures, so an EOL/path surprise shows up here first (the
    # round-trip fixtures already needed a .gitattributes pin to survive CRLF
    # checkouts — ubuntu CI could never see that class of failure).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run CommonMark + GFM conformance suites
        run: pnpm -C packages/muya test:spec
