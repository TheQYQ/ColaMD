name: Muya Lint

on:
  # Called by nightly.yml: the full gate set runs on the default branch on a
  # schedule, with no path filters (see nightly.yml for why the PR filters
  # alone leave pure-batch blind spots).
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/**'
      - '!packages/muya/examples/**'
      - '!packages/muya/e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-lint.yml'

concurrency:
  # Name prefix hardcoded on purpose: inside a called workflow (nightly.yml)
  # ${{ github.workflow }} resolves to the CALLER's name, so all ten legs
  # would collapse onto one group and cancel each other mid-run. On the
  # direct PR/push paths this is the same string as before.
  group: Muya Lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run ESLint (muya)
        run: pnpm -C packages/muya lint

      - name: Run TypeScript typecheck (muya)
        run: pnpm -C packages/muya lint:types
