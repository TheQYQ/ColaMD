name: Nightly Full Gate

# Safety net for the PR path filters. The desktop four (build/lint/test/e2e)
# ignore packages/muya/** and the muya six only run on muya paths plus
# pnpm-lock.yaml, so a pure-desktop batch gets zero engine verification and a
# pure-engine batch gets zero desktop verification (AGENTS.md 流程节 records
# the measurements: PRs #43/#44/#45/#48 each ran only 4 workflows). Merges
# into main produce no runs at all — build.yml and e2e.yml are PR-only and
# main pushes match nothing. This workflow calls all ten legs on a schedule
# with no path filters, on the default branch: the integrated state of what
# users download is checked even when no batch shape would have checked it.
#
# Design notes:
#   - The ten legs are called as reusable workflows (each carries a
#     `workflow_call` trigger) instead of being re-implemented here, so a
#     change to a leg applies to the nightly automatically — one source of
#     truth per leg, no drift between "what PRs run" and "what nightly runs".
#   - schedule always runs on the default branch, so the automated run covers
#     main. To run the full gate set against another branch (e.g. develop
#     right after a batch lands), use workflow_dispatch from the Actions tab
#     and pick the branch there — that is also the "run the missing leg for
#     this batch" tool.
#   - Cost: the same ten legs a lock-file-touching batch runs on a PR. Public
#     repository, standard runners are free. The PR cost profile is
#     deliberately unchanged — this is additive. To dial back to weekly,
#     change the cron below; nothing else needs to move.
#   - validate-licenses.yml is intentionally not called: it only matters when
#     package.json or pnpm-lock.yaml changes, and its push-to-develop trigger
#     already covers exactly that case with no filter gap.
#   - build.yml's comment-on-pr job is guarded on a pull_request event and is
#     skipped in this context.
#   - Concurrency: every leg keeps its own group, but each prefix is the leg's
#     name hardcoded rather than ${{ github.workflow }}. Inside a called
#     workflow that context resolves to the CALLER's name, so with it all ten
#     legs would collapse onto one group — the same string this workflow's own
#     concurrency uses — deadlocking the run against itself while cancelling
#     each other mid-flight. Measured 2026-10-23 on the first dispatch after
#     the permissions fix below: ten legs, one group name,
#     "Canceling since a deadlock was detected for concurrency group ...
#     between a top level workflow and 'desktop-lint'", ~2s, zero jobs run.
#     The hardcoded prefix evaluates to the identical string as
#     ${{ github.workflow }} on the legs' direct PR/push paths, so nothing
#     about their standalone behavior changes.
#   - Permissions: the workflow-level grant is read-only; desktop-build alone
#     gets pull-requests: write at the job level because build.yml's
#     comment-on-pr job needs it (see that job's comment for the full story —
#     a read-only caller makes GitHub refuse to compile the call at startup).

on:
  schedule:
    # Daily 03:17 UTC — off the hour on purpose; GitHub schedules drift near
    # the top of the hour (same reason audit.yml uses :23).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-lint:
    uses: ./.github/workflows/lint.yml
  desktop-test:
    uses: ./.github/workflows/test.yml
  desktop-build:
    # build.yml's comment-on-pr job requests `pull-requests: write` to post the
    # artifact-links comment. Along a reusable-workflow chain permissions can
    # only be maintained or reduced, never elevated, so a caller that grants
    # only read makes GitHub refuse to compile the call at startup — measured
    # 2026-10-21/22/23: three consecutive schedules died in ~1s with
    # startup_failure, "The nested job 'comment-on-pr' is requesting
    # 'pull-requests: write', but is only allowed 'pull-requests: read'", and
    # the workflow had never run once since it was added on 2026-10-20.
    #
    # The write scope is granted to this job only: the other nine legs keep the
    # workflow-level read-only grant below. It is also granted-but-unused here
    # — comment-on-pr is guarded on a same-repo PR head
    # (`github.event.pull_request.head.repo.full_name == github.repository`),
    # which is null on a schedule event, so the job is skipped and no comment
    # is ever posted from this context.
    #
    # Job-level permissions replace the workflow-level set for this job rather
    # than merging with it (unspecified scopes become `none`), so all three
    # scopes build.yml's two jobs need are restated here.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/build.yml
  desktop-e2e:
    uses: ./.github/workflows/e2e.yml
  muya-build:
    uses: ./.github/workflows/muya-build.yml
  muya-lint:
    uses: ./.github/workflows/muya-lint.yml
  muya-test:
    uses: ./.github/workflows/muya-test.yml
  muya-spec:
    uses: ./.github/workflows/muya-spec.yml
  muya-circular:
    uses: ./.github/workflows/muya-circular.yml
  muya-e2e:
    uses: ./.github/workflows/muya-e2e.yml
